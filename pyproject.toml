[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-evolution"
version = "0.1.0.dev0"
description = "Evolve an agent harness from its own trajectories: diagnose traces, propose source changes, gate them on held-out tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.scripts]
hevo = "harness_evolution.cli:main"

[project.optional-dependencies]
openai = ["openai"]
test = ["pytest"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness_evolution = ["harnesses/*/skills/**/*.md", "*/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
