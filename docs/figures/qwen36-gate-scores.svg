  <rect x="80" y="470" width="820" height="46" fill="#fafafa" stroke="#eee"/>
  <text x="76" y="490" font-size="11" fill="#555" text-anchor="end">未进</text>
  <text x="76" y="504" font-size="11" fill="#555" text-anchor="end">held-out</text>
