  <text x="80" y="50" font-size="12" fill="#555">harnessRL-tmax32-fulltb21-loop-20261007-qwen36-diagnosis-v8 · 每步 2 个候选，须严格超过 parent 才晋级</text>

  <!-- grid -->
  <g stroke="#e5e5e5" stroke-width="1">
