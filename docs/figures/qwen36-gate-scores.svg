  <path d="M80 215.5 H162 V146.4 H490 V129.1 H900" fill="none" stroke="#374151" stroke-width="2.5"/>
  <g font-size="12" fill="#374151">
    <text x="84" y="208">parent 23</text>
    <text x="166" y="139">parent 27 (fb5a487)</text>
    <text x="600" y="122">parent 28 (6a7fa62)</text>
  </g>

