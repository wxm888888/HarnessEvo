  <g fill="#3b82f6" stroke="#1e40af" stroke-width="1">
    <circle cx="107" cy="215.5" r="6"/>
    <circle cx="189" cy="232.7" r="6"/>
    <circle cx="217" cy="163.6" r="6"/>
    <circle cx="271" cy="232.7" r="6"/>
    <circle cx="353" cy="215.5" r="6"/>
    <circle cx="463" cy="232.7" r="6"/>
    <circle cx="517" cy="129.1" r="6"/>
  </g>
  <g font-size="11" fill="#1e3a8a">
    <text x="95" y="236" text-anchor="middle">23</text>
    <text x="189" y="253" text-anchor="middle">22</text>
    <text x="231" y="167">26</text>
    <text x="271" y="253" text-anchor="middle">22</text>
    <text x="353" y="236" text-anchor="middle">23</text>
    <text x="463" y="253" text-anchor="middle">22</text>
    <text x="517" y="150" text-anchor="middle">28</text>
    <text x="517" y="163" text-anchor="middle" font-size="10">(=parent)</text>
