    <path d="M840 486 l10 10 M850 486 l-10 10"/><path d="M868 486 l10 10 M878 486 l-10 10"/>
  </g>
  <text x="736" y="512" font-size="11" fill="#b91c1c" text-anchor="middle">step 7–10 共 8 个候选 typecheck 失败（node_modules 指向的旧工作区缺失，环境问题）</text>

  <!-- legend -->
  <g font-size="12" fill="#333">
    <line x1="80" y1="578" x2="104" y2="578" stroke="#374151" stroke-width="2.5"/><text x="110" y="582">parent（当前 harness）分数</text>
    <path d="M290 570 l3.1 6.4 7 1 -5.1 4.9 1.2 7 -6.2 -3.3 -6.2 3.3 1.2 -7 -5.1 -4.9 7 -1z" fill="#16a34a"/><text x="304" y="582">晋级的候选</text>
    <circle cx="400" cy="578" r="6" fill="#3b82f6"/><text x="412" y="582">被拒的候选</text>
    <circle cx="510" cy="578" r="6" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="522" y="582">被拒，且大量题目报错</text>
    <path d="M668 572 l10 10 M678 572 l-10 10" stroke="#dc2626" stroke-width="2.2"/><text x="686" y="582">静态检查失败</text>
  </g>
  <text x="80" y="612" font-size="11.5" fill="#555">每个分数是 89 题各跑 1 次的结果；step 4 的 2f8ed55 候选 23/89 来自 gate.json（resume 后 step.json 未记录候选）。</text>
  <text x="80" y="630" font-size="11.5" fill="#555">10 步共 20 个候选：2 个晋级（step 1、5），8 个进了 held-out 未超过 parent，2 个 no-op，8 个 typecheck 失败。</text>
</svg>
