  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="121" y="540">step 1</text><text x="203" y="540">step 2</text><text x="285" y="540">step 3</text><text x="367" y="540">step 4</text><text x="449" y="540">step 5</text>
    <text x="531" y="540">step 6</text><text x="613" y="540">step 7</text><text x="695" y="540">step 8</text><text x="777" y="540">step 9</text><text x="859" y="540">step 10</text>
